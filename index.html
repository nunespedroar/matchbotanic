<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Botânico - Qual é a sua planta?</title>
    <style>
@font-face{font-family:PP Telegraf;src:url("PPTelegraf-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
:root{color-scheme:dark;--bg-dark:#143520;--text-main:#F1EDE2;--text-muted:#d1ddc9;--accent:#F1EDE2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:36px 20px;background:#143520;color:#F1EDE2;font-family:"PP Telegraf",Arial,sans-serif}
button{font:inherit}
.container{width:100%;max-width:620px;padding:clamp(24px,6vw,52px);border:1px solid rgba(241,237,226,.32);border-radius:24px;background:rgba(0,0,0,.12);box-shadow:0 18px 60px rgba(0,0,0,.14)}
h1{text-align:center;color:#F1EDE2;letter-spacing:-.045em;font-size:clamp(2.25rem,7vw,3.6rem);line-height:1.02;margin:0 0 16px}
p.subtitle{text-align:center;color:var(--text-muted);font-size:1rem;line-height:1.5;margin:0 auto 40px;max-width:390px}
.question-container{display:none}.question-container.active{display:block}
h3{font-size:1.3rem;line-height:1.35;margin:0 0 22px;font-weight:400}
.options{display:flex;flex-direction:column;gap:10px}
button.option-btn{width:100%;padding:17px 18px;text-align:left;line-height:1.4;color:#F1EDE2;background:rgba(241,237,226,.06);border:1px solid rgba(241,237,226,.25);border-radius:12px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
button.option-btn:hover{background:rgba(241,237,226,.15);border-color:#F1EDE2;transform:translateY(-2px)}
button:focus-visible{outline:3px solid #F1EDE2;outline-offset:3px}
#result-container{display:none;text-align:center}.plant-card{text-align:left;border-top:1px solid rgba(241,237,226,.4);padding-top:24px}.plant-card img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:18px}.plant-card h2{font-size:1.8rem;line-height:1.2;margin:0 0 20px;color:#F1EDE2}.plant-card p{line-height:1.6;color:#F1EDE2}.restart-btn{background:#F1EDE2;color:#143520;border:0;border-radius:12px;padding:16px 24px;margin-top:20px;cursor:pointer;width:100%;font-weight:bold}.restart-btn:hover{background:#dbe6d3}
@media(max-width:420px){body{padding:16px}.container{padding:28px 20px}p.subtitle{margin-bottom:30px}}
</style>
</head>
<body>

<div class="container">
    <h1>🌱 Match Botânico</h1>
    <p class="subtitle">Descubra qual das 6 plantas icônicas é a sua alma gêmea vegetal!</p>

    <div id="quiz-form">
        <!-- Q1 -->
        <div class="question-container active" id="q1">
            <h3>1. Como é a sua memória para rotinas de cuidado?</h3>
            <div class="options">
                <button class="option-btn" onclick="answer(1, 'A')">A) Esqueço até de beber água. Preciso de algo indestrutível.</button>
                <button class="option-btn" onclick="answer(1, 'B')">B) Cuido no final de semana, mas sem complicações.</button>
                <button class="option-btn" onclick="answer(1, 'C')">C) Adoro borrifar água, medir umidade e dedicar tempo.</button>
            </div>
        </div>

        <!-- Q2 -->
        <div class="question-container" id="q2">
            <h3>2. O que você busca no visual da planta?</h3>
            <div class="options">
                <button class="option-btn" onclick="answer(2, 'A')">A) Clássico, resistente e que aguente sombra.</button>
                <button class="option-btn" onclick="answer(2, 'B')">B) Folhas grandes, tropicais e volumosas.</button>
                <button class="option-btn" onclick="answer(2, 'C')">C) Textura mutante, cortes exóticos e estilo único.</button>
            </div>
        </div>

        <!-- Q3 -->
        <div class="question-container" id="q3">
            <h3>3. Como reage quando a planta dá "drama"?</h3>
            <div class="options">
                <button class="option-btn" onclick="answer(3, 'A')">A) Zero paciência. Ou sobrevive sozinha ou não serve.</button>
                <button class="option-btn" onclick="answer(3, 'B')">B) Mudo de lugar e tento ajustar o ambiente.</button>
                <button class="option-btn" onclick="answer(3, 'C')">C) Adoro desafios! Quanto mais exigente, mais me empolgo.</button>
            </div>
        </div>

        <!-- Q4 -->
        <div class="question-container" id="q4">
            <h3>4. Se você fosse uma planta na natureza, qual seria o seu superpoder?</h3>
            <div class="options">
                <button class="option-btn" onclick="answer(4, 'A')">A) Sobreviver no deserto sem água e parecer impecável.</button>
                <button class="option-btn" onclick="answer(4, 'B')">B) Escalar paredes e tomar conta do espaço rápido.</button>
                <button class="option-btn" onclick="answer(4, 'C')">C) Ter um visual mutante que deixa todos hipnotizados.</button>
            </div>
        </div>
    </div>

    <!-- RESULTADO -->
    <div id="result-container" aria-live="polite">
        <div class="plant-card" id="plant-output"></div>
        <button class="restart-btn" onclick="restartQuiz()">Refazer Quiz</button>
    </div>
</div>

<script>
    let answers = { q1: '', q2: '', q3: '', q4: '' };

    function answer(qNum, choice) {
        answers['q' + qNum] = choice;
        document.getElementById('q' + qNum).classList.remove('active');
        
        let next = qNum + 1;
        let nextElem = document.getElementById('q' + next);
        if (nextElem) {
            nextElem.classList.add('active');
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-form').style.display = 'none';
        let output = document.getElementById('plant-output');
        
        let countA = Object.values(answers).filter(v => v === 'A').length;
        let countB = Object.values(answers).filter(v => v === 'B').length;
        let countC = Object.values(answers).filter(v => v === 'C').length;

        let title = '', desc = '', origin = '', imgSrc = '';

        if (countA >= 3) {
            title = "🌵 Zamioculca";
            origin = "África Oriental";
            imgSrc = "zamioculca.jpg"; // Nome do arquivo da foto
            desc = "Você é a definição de resiliência e praticidade. A Zamioculca guarda água nas raízes, tolera ambientes com luz indireta e precisa de regas espaçadas, conforme as condições do ambiente.";
        } else if (countA === 2 && countB >= 1) {
            title = "🛡️ Comigo-Ninguém-Pode";
            origin = "América Tropical";
            imgSrc = "comigo-ninguem-pode.jpg";
            desc = "Você é forte, tem presença marcante e não se deixa abalar por qualquer coisa. Essa planta é famosa pela folhas marcantes e por trazer aquela energia de proteção imbatível para o espaço.";
        } else if (countB >= 3) {
            title = "🍃 Monstera Deliciosa (Costela-de-Adão)";
            origin = "México";
            imgSrc = "monstera.jpg";
            desc = "Você é sociável, expansivo(a) e ama ver as coisas crescerem. A Monstera abre recortados incríveis nas folhas à medida que ganha espaço, transformando qualquer canto numa selva acolhedora.";
        } else if (countB === 2 || (countA === 1 && countB === 2)) {
            title = "🌱 Pacová";
            origin = "Brasil (Mata Atlântica)";
            imgSrc = "pacova.jpg";
            desc = "Você aprecia o design elegante e a consistência sem complicações. O Pacová tem folhas largas, couro brilhante e uma estrutura impecável que não exige sol direto.";
        } else if (countC === 2 && countB >= 1) {
            title = "✨ Alocasia Polly";
            origin = "Ásia Tropical";
            imgSrc = "alocasia-polly.jpg";
            desc = "Você tem um olho refinado para o design e não se importa de dar um pouco mais de atenção aos detalhes. A Polly parece uma escultura prateada desenhada à mão.";
        } else {
            title = "🖤 Alocasia Jacklyn";
            origin = "Indonésia";
            imgSrc = "alocasia-jacklyn.jpg";
            desc = "Você é o nível máximo de personalidade, mistério e ousadia! A Jacklyn é o troféu dos colecionadores: textura recortada gótica, nervuras escuras e uma presença exótica que domina o ambiente.";
        }

        output.innerHTML = `
            <img src="${imgSrc}" alt="${title}" onerror="this.style.display='none'">
            <h2>${title}</h2>
            <p><strong>Origem:</strong> ${origin}</p>
            <p>${desc}</p>
        `;
        document.getElementById('result-container').style.display = 'block';
    }

    function restartQuiz() {
        answers = { q1: '', q2: '', q3: '', q4: '' };
        document.getElementById('result-container').style.display = 'none';
        document.getElementById('quiz-form').style.display = 'block';
        document.getElementById('q1').classList.add('active');
    }
</script>

</body>
</html>
